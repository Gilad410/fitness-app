<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>איפוס סיסמה</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #111827;
      direction: rtl;
      text-align: right;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f5f7fb; padding: 32px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background: #11153f;
                  padding: 22px 28px;
                  color: #ffffff;
                  font-size: 22px;
                  font-weight: 700;
                "
              >
                ניהול כושר
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 28px">
                <h1 style="margin: 0 0 14px; font-size: 24px; line-height: 1.4">איפוס הסיסמה</h1>
                <p style="margin: 0 0 22px; color: #4b5563; font-size: 16px; line-height: 1.7">
                  התקבלה בקשה לבחור סיסמה חדשה לחשבון שלך. הקישור מיועד לשימוש אישי.
                </p>
                <p style="margin: 0 0 24px; text-align: center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background: #2563eb;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 700;
                      padding: 13px 24px;
                      border-radius: 10px;
                    "
                    >בחירת סיסמה חדשה</a
                  >
                </p>
                <p style="margin: 0; color: #6b7280; font-size: 13px; line-height: 1.6">
                  אם לא ביקשת לאפס את הסיסמה, אפשר להתעלם מההודעה והסיסמה הקיימת תישאר ללא שינוי.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
